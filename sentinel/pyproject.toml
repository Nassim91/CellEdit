[project]
name = "sentinel-yield-agent"
version = "0.1.0"
description = "DeFi Yield Intelligence Agent — Cross-chain yield discovery, protocol analysis, and market-neutral strategy reports for asset managers."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Sentinel Team" }]

dependencies = [
    "httpx>=0.27,<1",
    "aiohttp>=3.9,<4",
    "pydantic>=2.5,<3",
    "pydantic-settings>=2.1,<3",
    "rich>=13.7,<14",
    "jinja2>=3.1,<4",
    "pandas>=2.2,<3",
    "numpy>=1.26,<3",
    "web3>=7.0,<8",
    "python-dotenv>=1.0,<2",
    "structlog>=24.1,<25",
    "typer>=0.12,<1",
    "tenacity>=8.2,<10",
    "tweepy>=4.14,<5",
    "textblob>=0.18,<1",
    "diskcache>=5.6,<6",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<9",
    "pytest-asyncio>=0.23,<1",
    "pytest-httpx>=0.30,<1",
    "ruff>=0.3,<1",
    "mypy>=1.8,<2",
]
pdf = [
    "weasyprint>=62,<63",
]

[project.scripts]
sentinel = "sentinel.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.mypy]
python_version = "3.11"
strict = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
